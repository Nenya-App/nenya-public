[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  # Node 24 (Node 20 is end of life). This sets the build. The function runtime is a separate setting on an existing
  # site: see docs/branches-and-previews.md ("Node 24").
  NODE_VERSION = "24"

# The /coach demo's relay function (see netlify/functions/coach.mts).
[functions]
  directory = "netlify/functions"

# ── Rate limiting ─────────────────────────────────────────────────────────
# Free/Starter/Personal plans allow 2 code-based rate-limit rules per project
# (UI-configured rulesets require Enterprise + High-Performance Edge). Both
# slots are used:
#   1. The app entry point, below.
#   2. The /api/coach function, whose limit is set in
#      netlify/functions/coach.mts (it cannot be set in this file).
# The compiled-asset rule that used to take slot 2 was removed: one page load
# fetches many files, so groups sharing an IP (event Wi-Fi, schools, offices)
# could trip it, and Netlify's own DDoS protection already runs first.

# /coach is its own page (coach/index.html). Rewrite (not redirect) the path to
# that file: a redirect to "/coach/" loops, because Netlify treats /coach and
# /coach/ as the same rule path. Listed first because the first matching rule
# wins. It is not a rate-limit rule, so it doesn't use up a slot.
[[redirects]]
  from = "/coach"
  to = "/coach/index.html"
  status = 200
  force = true

# /cell is partner practice's own page (cell/index.html), rewritten the same way as /coach. Not a rate-limit rule.
[[redirects]]
  from = "/cell"
  to = "/cell/index.html"
  status = 200
  force = true

# Rule 1: app entry point. Caps how many fresh app loads a single IP can
# request per minute -- the main "someone is hammering the site" vector.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  [redirects.rate_limit]
    window_limit = 300
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[headers]]
  for = "/*"
  [headers.values]
    # ── Framing ───────────────────────────────────────────────────────────────
    # Belt-and-suspenders with CSP frame-ancestors below
    X-Frame-Options = "DENY"

    # ── MIME sniffing ────────────────────────────────────────────────────────
    X-Content-Type-Options = "nosniff"

    # ── Referrer ──────────────────────────────────────────────────────────────
    # Send origin on same-site requests only; nothing on cross-site navigation
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ── Window isolation ─────────────────────────────────────────────────────
    # Keeps other sites' windows (for example, anything this page opens) from holding a
    # reference to this one, and the reverse. The site opens no pop-ups or sign-in windows,
    # and its outbound links use noopener, so nothing relies on a shared opener.
    Cross-Origin-Opener-Policy = "same-origin"

    # ── Browser features ─────────────────────────────────────────────────────
    # Deny access to hardware and tracking APIs the site never needs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"

    # ── HTTPS enforcement ────────────────────────────────────────────────────
    # 1 year; include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # ── Content Security Policy ───────────────────────────────────────────────
    #
    # Notes on each directive:
    #
    # script-src 'self'
    #   Only self-hosted scripts. No inline scripts exist in this build.
    #   UPGRADE PATH: Install the Netlify CSP Nonce extension in the dashboard
    #   (Extensions → Content Security Policy). It injects a per-request nonce
    #   via Edge Function, changing 'self' to 'nonce-{random}' automatically —
    #   the strongest available protection against injected scripts.
    #
    # style-src 'self' 'unsafe-inline'
    #   'unsafe-inline' required: React renders inline style props as style=""
    #   attributes (Framer Motion, breathing counter positioning, colorblind
    #   filters, etc.). Removing it requires migrating all inline styles to
    #   CSS classes. Risk is bounded: inline styles cannot execute JS.
    #
    # font-src 'self'
    #   Cinzel, Manrope, and Cormorant Garamond are self-hosted under
    #   /fonts (see src/styles/fonts.css) rather than loaded from Google
    #   Fonts, so no third-party font-src is needed.
    #
    # img-src 'self' data: blob:
    #   data: needed for the shared Body Map's canvas capture (BodyMapAvatar
    #   produces an imageDataUrl, reachable from every gateway) and jsPDF
    #   report export.
    #   blob: kept for any future canvas/file export path.
    #
    # connect-src 'self'
    #   No external API calls. Venice AI opens in a new tab (navigation),
    #   not a fetch/XHR, so it does not need to be listed here.
    #
    # frame-src 'none' + frame-ancestors 'none'
    #   Belt-and-suspenders: site neither embeds iframes nor can be iframed.
    #
    # worker-src 'none'
    #   No Web Workers or Service Workers in use.
    #
    # form-action 'self'
    #   Prevents form submission hijacking to external URLs. Covers the
    #   Netlify Forms report-submission POST to "/" (see reportSubmission.ts).
    #
    # manifest-src 'self'
    #   Web app manifest served from same origin.
    #
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'; form-action 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'"

    # ── CSP violation reporting ───────────────────────────────────────────────
    # Violations log automatically once the Netlify CSP extension is enabled
    # (Logs & Metrics → Functions → __csp-violations).
    # For external monitoring, add: report-uri https://your-report-uri-endpoint

# ── The owner's private page ────────────────────────────────────────────────
# Not linked from anywhere, and kept out of search results as well as by the page's own robots tag.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Partner practice, while it is being tested ──────────────────────────────
[[headers]]
  for = "/cell/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── The design bench ────────────────────────────────────────────────────────
# /bench, for tuning the logo's gem and orbits side by side. Not linked from anywhere, and kept out of search results.
[[headers]]
  for = "/bench/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Caching ─────────────────────────────────────────────────────────────────
# By default Netlify tells browsers to re-check every file on every visit. These rules let returning
# visitors keep the files that never change under the same name, so a second visit loads almost
# instantly. Pages themselves (index.html and the other .html files) are left alone on purpose, so a
# new deploy shows up immediately.

# Everything the build puts in /assets has a content hash in its name (a changed file gets a new name),
# so it can be kept for a year. Nothing unhashed may live here: see tests/assets.test.mts.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts keep fixed names. If a font file is ever replaced, give the new file a new name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons, badges and the files used only when a PDF report is made: rarely change, and keep their names,
# so a week is long enough to help and short enough that a change is not stuck for long.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/badges/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/pdf-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
