<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Nenya — Take a Moment to Breathe</title>
    <meta name="description" content="Nenya is a free, no-account guided breathing and reflection tool with an optional AI coach demo. Begin with a moment to breathe, then reflect through color, sound, and touch." />
    <link rel="canonical" href="https://nenya.biz/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Nenya",
      "url": "https://nenya.biz/",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Any modern web browser",
      "description": "A free, no-account guided breathing and sensory reflection tool with an optional early-prototype AI coach demo. Not therapy and not a crisis service.",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "license": "https://www.gnu.org/licenses/agpl-3.0.html"
    }
    </script>
    <meta name="robots" content="index, follow" />

    <!-- Icons & PWA manifest -- lets a visitor add Nenya to their home
         screen (Android/Chrome/Edge) or install it as an app, with the
         same icon everywhere. No accounts or install tracking involved:
         this is a static manifest file, nothing is reported anywhere. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Start the two fonts the first screen needs now, in parallel with the scripts, instead of
         waiting until the page has rendered and discovered them. Fonts need the crossorigin
         attribute even from the same site, or the preload is wasted. -->
    <link rel="preload" href="/fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cinzel-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#1A1512" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nenya" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nenya.biz" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Nenya — Take a Moment to Breathe" />
    <meta property="og:description" content="A free digital sanctuary for reflection, emotional regulation, and ethical self-inquiry. No account required. No advertising. No subscription required." />
    <meta property="og:image" content="https://nenya.biz/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nenya logo: a faceted rainbow gem at the center of two interlaced six-petaled flowers, gold and cream, ringed by sixteen colored orbs." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nenya — Take a Moment to Breathe" />
    <meta name="twitter:description" content="A free digital sanctuary for reflection, emotional regulation, and ethical self-inquiry." />
    <meta name="twitter:image" content="https://nenya.biz/og-image.jpg" />

    <!-- The only styles the first paint needs: the page's stylesheet loads without blocking it (see vite.config.ts). -->
    <style>html, body { height: 100%; margin: 0; } html { background: #1A1512; } #root { height: 100%; }</style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms only detects forms present in the built HTML at
         deploy time -- it can't see forms rendered later by React. This
         static, hidden copy exists purely so Netlify's build step
         registers the "report-submission" form and its fields; the real,
         interactive version is rendered by React and POSTs here with the
         same field names (see src/lib/reportSubmission.ts). Never remove
         this without also removing the JS-side submission logic, or
         submissions will silently start failing. -->
    <form name="report-submission" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="report-submission" />
      <input type="text" name="bot-field" />
      <input type="text" name="type" />
      <textarea name="report"></textarea>
      <textarea name="comments"></textarea>
    </form>

    <!-- An alert for signed coach-demo transcripts: it reaches this form only through the report function (netlify/functions/report.mts) after their signature has been
         checked, and carries only the fingerprint and the person's choices. The conversation itself is kept in the site's private store, never in the form. -->
    <form name="verified-transcript" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="verified-transcript" />
      <input type="text" name="bot-field" />
      <input type="text" name="receipt-hash" />
      <input type="text" name="issued-at" />
      <textarea name="permissions"></textarea>
      <input type="text" name="keep-until" />
      <input type="text" name="checked" />
      <input type="text" name="key-id" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
