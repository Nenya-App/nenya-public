# Runs on every pull request and on pushes to dev and main: type-check, tests, build, and an audit of the
# production dependencies. Actions are pinned to exact commits (the comment names the release) so a moved
# tag cannot change what runs. This job has read-only access and uses no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install exactly what package-lock.json lists
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
